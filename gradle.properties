# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# CLAUDE CODE: heap de 3GB para el daemon de Gradle. Compromiso para PCs
# de 8GB de RAM:
#   - 2GB pelea con R8/D8 al dexar librerias grandes (Firebase,
#     material-icons-extended). Se vio en el Paso 5.
#   - 4GB asfixia el resto del sistema y Android Studio se bloquea / cierra.
#     Se vio en el Paso 9.
#   - 3GB es el sweet spot tipico para 8GB. Si vuelve a petar OOM al dexar,
#     toca cerrar navegador y otras apps pesadas durante el build.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# CLAUDE CODE: configuration cache acelera builds reusando el grafo de
# tareas. Reduce trabajo del daemon en builds incrementales.
org.gradle.configuration-cache=true

# CLAUDE CODE: build cache reusa resultados de tareas anteriores entre
# proyectos. Ahorra trabajo de compilacion de modulos sin cambios.
org.gradle.caching=true

# CLAUDE CODE: paralelismo desactivado a proposito. Con 8GB no merece la
# pena ejecutar varias tareas a la vez: cada una tira de heap independiente.
# Mejor secuencial pero estable que paralelo con riesgo de OOM.
# org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
